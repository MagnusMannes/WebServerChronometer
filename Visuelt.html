<!DOCTYPE html>
<html>
<body>
  <h1>UART data</h1>
  <pre id="data"></pre>

  <script>
    async function loadData() {
      const res = await fetch('data.json?_=' + Date.now());
      const json = await res.json();
      document.getElementById('data').innerText = JSON.stringify(json, null, 2);
    }
    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
